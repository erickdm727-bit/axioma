name: Refresh extended-hours archive

on:
  schedule:
      - cron: "0 6 * * *"  # once a day; GitHub delays cron heavily on public repos, that's fine here
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run refresh-extended-hours.mjs
        env:
          STOCKDATA_API_KEY: ${{ secrets.STOCKDATA_API_KEY }}
        run: node scripts/refresh-extended-hours.mjs

      - name: Commit data/extended-hours if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/extended-hours
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Archive extended-hours data [skip ci]"
            git push
          fi

