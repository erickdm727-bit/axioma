name: Buscador de oportunidades de compra

on:
  schedule:
    - cron: "0 22 * * 1-5"  # ~5:00pm ET (después del cierre), lunes a viernes
  workflow_dispatch:

permissions:
  contents: write

jobs:
  find-opportunities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Ejecutar find-opportunities.mjs
        env:
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
        run: node scripts/find-opportunities.mjs

      - name: Commit data/opportunities.json si cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/opportunities.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Actualiza oportunidades de compra [skip ci]"
            git push
          fi
