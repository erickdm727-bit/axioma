name: Bitácora de predicciones (Mapa de movimiento)

on:
  schedule:
    - cron: "30 21 * * 1-5"  # ~4:30pm ET (después del cierre), lunes a viernes
  workflow_dispatch:

permissions:
  contents: write

jobs:
  log-predictions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Ejecutar log-predictions.mjs
        env:
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        run: node scripts/log-predictions.mjs

      - name: Commit data/predictions-log.json si cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/predictions-log.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Actualiza bitácora de predicciones [skip ci]"
            git push
          fi
