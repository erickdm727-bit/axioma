name: Refresh portfolio cache

on:
  schedule:
      - cron: "0 */2 * * *"  # every 2 hours; script itself skips runs when the US market is closed
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run refresh-cache.mjs
        env:
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        run: node scripts/refresh-cache.mjs

      - name: Commit data/portfolio-cache.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/portfolio-cache.json data/watchlist.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Refresh portfolio cache [skip ci]"
            git push
          fi

